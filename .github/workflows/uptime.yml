name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write # only for the keepalive commit below
concurrency: uptime
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Restores the newest state/ saved by a previous run (keys are unique per run).
      - uses: actions/cache@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - run: bash check.sh
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      # GitHub disables cron workflows after 60 days without repo activity; keep it alive.
      - name: keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if (( $(date +%s) - last > 45 * 86400 )); then
            git config user.name "uptime-bot"; git config user.email "uptime-bot@users.noreply.github.com"
            git commit --allow-empty -qm "keepalive" && git push -q
          fi
